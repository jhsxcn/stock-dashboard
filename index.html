<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 板块强度轮动周期图</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<script>window.echarts||document.write('<script src="./echarts.min.js"><\/script>')</script>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3550; --text:#e8ecf4; --sub:#8b95ab; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  .hdr { padding:14px 16px; background:linear-gradient(135deg,#2d3436,#0984e3); font-size:16px; font-weight:bold; position:sticky; top:0; z-index:10; }
  .hdr small { font-weight:normal; opacity:.8; margin-left:8px; }
  .nav { padding:8px 16px; display:flex; gap:8px; flex-wrap:wrap; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:52px; z-index:9; }
  .nav button { background:#2a3550; color:var(--text); border:1px solid #3a4a6a; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .nav button.on { background:#0984e3; border-color:#0984e3; }
  .card { margin:12px; background:var(--card); border-radius:10px; padding:12px; border:1px solid var(--line); }
  .card h3 { margin:0 0 10px; font-size:14px; color:#74b9ff; }
  #chartTrend, #chartDay, #chartHeat { width:100%; height:380px; }
  .legend-phase { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--sub); padding:4px 2px; }
  .legend-phase span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .ph-start{background:#00b894}.ph-expand{background:#0984e3}.ph-high{background:#e17055}.ph-recede{background:#6c5ce7}.ph-freeze{background:#636e72}.ph-shake{background:#fdcb6e}
  #status { padding:6px 16px; font-size:12px; color:var(--sub); }
  /* 板块成分股弹窗 */
  #stkModal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#000a; z-index:200; justify-content:center; align-items:center; padding:12px; }
  #stkModal .box { background:var(--card); border:1px solid var(--line); border-radius:12px; max-width:640px; width:100%; max-height:85vh; overflow:auto; padding:16px; }
  #stkModal h3 { margin:0 0 8px; color:#74b9ff; }
  #stkModal table { width:100%; border-collapse:collapse; font-size:12px; margin:6px 0; }
  #stkModal th, #stkModal td { padding:5px 8px; text-align:left; border-bottom:1px solid var(--line); }
  #stkModal th { color:var(--sub); font-weight:normal; }
  #stkModal .close { float:right; cursor:pointer; color:var(--sub); font-size:18px; padding:0 6px; }
  #stkList { display:flex; flex-wrap:wrap; gap:6px; font-size:11px; color:var(--sub); }
  #stkList span { background:#2a3550; padding:3px 8px; border-radius:4px; }

</style>
</head>
<body>
<div class="hdr">📊 板块强度轮动周期图 <small id="lastUpdate">加载中...</small></div>
<div class="nav">
  <button class="on" onclick="showTrend()">📈 强度时序</button>
  <button onclick="showDay()">📊 当日TOP</button>
  <button onclick="showHeat()">🔥 轮动热力图</button>
  <select id="dateSel" onchange="if(document.getElementById('dayCard').style.display!=='none')showDay()" style="background:#2a3550;color:var(--text);border:1px solid #3a4a6a;border-radius:6px;padding:5px 8px"></select>
  <select id="plateSel" onchange="showTrend()" style="background:#2a3550;color:var(--text);border:1px solid #3a4a6a;border-radius:6px;padding:5px 8px"></select>
</div>
<div id="status"></div>
<div class="card" id="trendCard">
  <h3>板块强度时序曲线（KPL强度 score）</h3>
  <div class="legend-phase">
    <span class="ph-start">启动</span><span class="ph-expand">扩散</span>
    <span class="ph-high">高潮</span><span class="ph-recede">退潮</span>
    <span class="ph-freeze">冰点</span><span class="ph-shake">震荡</span>
  </div>
  <div id="chartTrend"></div>
</div>
<div class="card" id="dayCard" style="display:none">
  <h3>当日板块强度TOP12 + 主力资金 + 周期阶段</h3>
  <div id="chartDay"></div>
</div>
<div class="card" id="heatCard" style="display:none">
  <h3>板块强度轮动热力图（近20交易日）</h3>
  <div id="chartHeat"></div>
</div>
<div id="stkModal" onclick="if(event.target==this)this.style.display='none'">
  <div class="box">
    <span class="close" onclick="document.getElementById('stkModal').style.display='none'">✕</span>
    <h3 id="stkTitle">板块成分股</h3>
    <div style="font-size:12px;color:var(--sub);margin-bottom:4px">🏆 领涨股 TOP10（点击板块条形触发）</div>
    <table id="stkLeaderTbl"><thead><tr><th>名称</th><th>代码</th><th>涨幅</th></tr></thead><tbody id="stkLeader"></tbody></table>
    <div style="font-size:12px;color:var(--sub);margin:8px 0 4px">📋 成分股涨幅 TOP20</div>
    <div id="stkList"></div>
  </div>
</div>
<script>
let DATA = null;
let STOCKS = null;
let chartT, chartD, chartH;
let dayArr = [];  // 当日TOP数组(供点击)
const PHASE_COLOR = { "启动":"#00b894", "扩散":"#0984e3", "高潮":"#e17055", "退潮":"#6c5ce7", "冰点":"#636e72", "震荡":"#fdcb6e" };
const PHASE_ORDER = ["冰点","退潮","震荡","启动","扩散","高潮"];

function init(){ chartT=echarts.init(document.getElementById('chartTrend'));
  chartD=echarts.init(document.getElementById('chartDay'));
  chartH=echarts.init(document.getElementById('chartHeat'));
  chartD.on('click', p=>{ const i = dayArr.length-1-p.dataIndex; if(dayArr[i]) showStocks(dayArr[i].name); });
  chartH.on('click', p=>{ const d0 = Object.keys(DATA).sort().slice(-20)[p.value[0]]; if(d0){ const nm = Object.keys(DATA[d0])[p.value[1]]; showStocks(nm); } });
  window.addEventListener('resize',()=>{chartT.resize();chartD.resize();chartH.resize();}); }

function latestDay(){ const dates=Object.keys(DATA).sort(); return DATA[dates[dates.length-1]] ? Object.values(DATA[dates[dates.length-1]]).sort((a,b)=>a.rank-b.rank) : null; }

function showStocks(plateName){
  const s = STOCKS && STOCKS[plateName];
  if(!s){ document.getElementById('stkTitle').textContent = plateName + ' · 暂无成分股数据'; document.getElementById('stkLeader').innerHTML=''; document.getElementById('stkList').innerHTML=''; document.getElementById('stkModal').style.display='flex'; return; }
  document.getElementById('stkTitle').textContent = '📊 ' + plateName + ' · 成分股 ' + s.total + ' 只';
  document.getElementById('stkLeader').innerHTML = s.leaders.map(l=>`<tr><td>${l[0]}</td><td class="nm">${l[1]}</td><td class="nm">${l[2]}</td></tr>`).join('');
  document.getElementById('stkList').innerHTML = s.stocks.map(l=>`<span>${l[0]} ${l[1]} ${l[2]}</span>`).join('');
  document.getElementById('stkModal').style.display='flex';
}

async function load(){
  try{
    const r = await fetch('rotation_data.json?v='+Date.now());
    DATA = await r.json();
    try{ const rs = await fetch('rotation_stocks.json?v='+Date.now()); STOCKS = await rs.json(); }catch(e){ STOCKS = null; }
    const dates = Object.keys(DATA).sort();
    document.getElementById('lastUpdate').textContent = '数据至 ' + (dates[dates.length-1]||'') + ' · ' + dates.length + '个交易日';
    buildSel(dates);
    showDay();
  }catch(e){
    document.getElementById('lastUpdate').textContent = '❌ 数据加载失败';
    document.getElementById('status').textContent = '请确认 rotation_data.json 已生成（首次需先运行 generate_rotation.py）';
  }
}
const WEEK = ['日','一','二','三','四','五','六'];
function buildSel(dates){
  const sel = document.getElementById('plateSel');
  const names = new Set(); dates.forEach(d=>Object.keys(DATA[d]||{}).forEach(n=>names.add(n)));
  sel.innerHTML = [...names].map(n=>`<option>${n}</option>`).join('');
  // 板块默认选最新交易日 rank1 的热点板块
  const last = dates[dates.length-1];
  const top1 = Object.values(DATA[last]||{}).sort((a,b)=>a.rank-b.rank)[0];
  if(top1) sel.value = top1.name;
  // 日期下拉：倒序（最新在前），默认选中最新交易日
  const ds = document.getElementById('dateSel');
  ds.innerHTML = [...dates].reverse().map(d=>`<option value="${d}">${d} 周${WEEK[new Date(d+'T12:00:00').getDay()]}</option>`).join('');
  ds.value = last;
}
function showTrend(){
  document.getElementById('trendCard').style.display=''; document.getElementById('dayCard').style.display='none'; document.getElementById('heatCard').style.display='none';
  const dates = Object.keys(DATA).sort();
  let plate = document.getElementById('plateSel').value;
  // 若所选板块无历史, 回退到历史最全板块
  if(!dates.some(d=>DATA[d][plate])){
    const cnt = {}; dates.forEach(d=>Object.keys(DATA[d]).forEach(n=>cnt[n]=(cnt[n]||0)+1));
    plate = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
    document.getElementById('plateSel').value = plate;
  }
  const series = [];
  dates.forEach(d=>{ const p = DATA[d][plate]; if(p) series.push([d.slice(5), p.score]); });
  chartT.setOption({ tooltip:{trigger:'axis'}, grid:{left:45,right:20,top:20,bottom:45},
    xAxis:{type:'category',data:series.map(s=>s[0])},
    yAxis:{type:'value',name:'强度'},
    series:[{name:plate,type:'line',smooth:true,data:series.map(s=>s[1]),areaStyle:{opacity:.15},lineStyle:{width:3}}] });
}
function showDay(){
  document.getElementById('trendCard').style.display='none'; document.getElementById('dayCard').style.display=''; document.getElementById('heatCard').style.display='none';
  const dates = Object.keys(DATA).sort();
  const d = document.getElementById('dateSel').value || dates[dates.length-1];
  if(!DATA[d]){ chartD.clear(); return; }
  dayArr = Object.values(DATA[d]).sort((a,b)=>a.rank-b.rank);
  document.querySelector('#dayCard h3').textContent = d + ' 当日板块强度TOP12 + 主力资金 + 周期阶段';
  chartD.setOption({ tooltip:{trigger:'axis',axisPointer:{type:'shadow'}}, grid:{left:100,right:90,top:20,bottom:30},
    xAxis:{type:'value'}, yAxis:{type:'category',data:dayArr.map(p=>p.name).reverse()},
    series:[{type:'bar',data:dayArr.map(p=>({value:p.score,itemStyle:{color:PHASE_COLOR[p.phase]}})).reverse(),
      label:{show:true,position:'right',formatter:function(pp){const q=dayArr[dayArr.length-1-pp.dataIndex];return q?('强度'+q.score+' · '+q.phase):'';}}}] });
}
function showHeat(){
  document.getElementById('trendCard').style.display='none'; document.getElementById('dayCard').style.display='none'; document.getElementById('heatCard').style.display='';
  const dates = Object.keys(DATA).sort().slice(-20);
  const names = [];
  const seen = new Set();
  [...dates].reverse().forEach(d=>Object.values(DATA[d]).sort((a,b)=>a.rank-b.rank).forEach(p=>{if(!seen.has(p.name)&&names.length<12)names.push(p.name);}));
  const data = [];
  dates.forEach((d,di)=>{ names.forEach((n,ni)=>{ const p = DATA[d][n]; if(p) data.push([di,ni,p.score]); }); });
  chartH.setOption({ tooltip:{position:'top'}, grid:{left:80,right:20,top:10,bottom:60},
    xAxis:{type:'category',data:dates.map(d=>d.slice(5)),splitArea:{show:true}},
    yAxis:{type:'category',data:names,splitArea:{show:true}},
    visualMap:{min:0,max:30000,calculable:true,orient:'horizontal',left:'center',bottom:0,inRange:{color:['#2a3550','#0984e3','#e17055']}},
    series:[{type:'heatmap',data:data,label:{show:false}}] });
}
init(); load();
</script>
</body>
</html>
