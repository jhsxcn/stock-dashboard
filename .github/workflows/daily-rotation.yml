name: 📊 板块强度轮动周期
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install-deps
        run: pip install requests zzshare==0.4.8
      - name: run-rotation
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
          TZ: Asia/Shanghai
        run: python3 generate_rotation.py
      - name: commit-push
        run: |
          git config user.name "rotation-bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "📊 rotation update" || echo "no-change"
          git push
