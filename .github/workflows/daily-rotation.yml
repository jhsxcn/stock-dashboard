name: 📊 板块强度轮动周期
# 2026-09-19: 已禁用定时触发 —— repo 内 generate_rotation.py 为 zzshare 旧口径,
# 与服务器 v2 问财免token链路(18:10 cron)口径冲突, 停用避免数据互相覆盖。
# 数据生成统一走服务器; 本 workflow 仅保留手动触发(备用应急)。
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install-deps
        run: pip install requests zzshare==0.4.8
      - name: run-rotation
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
          TZ: Asia/Shanghai
        run: python3 generate_rotation.py
      - name: commit-push
        run: |
          git config user.name "rotation-bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "📊 rotation update" || echo "no-change"
          git push
