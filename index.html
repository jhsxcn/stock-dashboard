<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整合后的页面</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }

       .container {
            width: 100%;
            max-width: 800px;
            /* 最大宽度 */
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #000000;
        }

        img {
            vertical-align: middle;
            height: 40px;
            margin-left: 10px;
        }

       .controls {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            padding: 0 10px; /* 添加内边距防止内容贴边 */
        }

        input,
        select {
            padding: 5px;
            font-size: 14px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            background-color: #333;
            color: #ffffff;
            max-width: 100%; /* 确保不会超出容器宽度 */
            box-sizing: border-box; /* 包含padding在宽度内 */
        }

        /* 下拉列表特定样式调整 */
        #keywordSelect {
            min-width: 150px; /* 设置最小宽度 */
            max-width: calc(100% - 20px); /* 最大宽度不超过容器减去边距 */
        }

        button {
            padding: 5px 10px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 3px;
            border: none;
            border-radius: 4px;
            background-color: #000000;
            color: #f1c40f;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #000000;
            transform: scale(1.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        th,
        td {
            border: 1px solid #000;
            padding: 5px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #000000;
            color: #f1c40f;
        }

       .序号 {
            color: #f1c40f;
        }

       .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #000000;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box; /* 确保padding不增加总宽度 */
        }

        tr.highlighted {
            background-color: #333; /* 高亮背景颜色，可根据需要调整 */
        }

        p {
            display: inline;
            margin-right: 10px;
        }
       .input-container {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        #inputValue {
            width: 100%;
            height: 150px;
            font-size: 16px;
            padding: 10px 15px;
            resize: vertical; /* 允许垂直调整大小 */
            min-height: 50px; /* 最小高度 */
            font-family: Arial, sans-serif; /* 保持字体一致 */
            border: none;
            border-radius: 4px;
            background-color: #111;
            color: #ffffff;
            box-sizing: border-box; /* 确保padding不影响总高度 */
        }

        /* 分隔线样式 */
       .divider {
            width: 100%;
            height: 1px;
            background-color: #444;
            margin: 10px 0;
        }

        /* 响应式调整 - 在小屏幕上优化显示 */
        @media (max-width: 600px) {
           .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            #keywordSelect, button,.controls label {
                margin-right: 0;
                margin-bottom: 5px;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
      
        <div class="controls">
            <select id="keywordSelect">
                  <option value="无">无</option>
                <option value="涨停，去除st，去除北交所">涨停</option>
                <option value="跌停，去除st，去除北交所">跌停</option>
                <option value="炸板，去除st，去除北交所">炸板</option>
                <option value="曾跌停，去除st，去除北交所">曾跌停</option>
                <option value="开盘大跌，去除st，去除北交所">开盘大跌</option>
                <option value="人气前十，去除st，去除北交所">人气前十</option>
                <option value="委比前十，去除st，去除北交所">委比前十</option>
                <option
                    value="开盘成交量与昨日总量占比大于5%，且开盘涨幅大于1%小于9.5%；去除st，竞价涨幅，去除涨跌幅小于0%，涨跌幅，去除科创板">
                    竞价</option>
                <!-- 保存的问句将在这里动态添加 -->
            </select>
            <label for="inputValue">请选股:</label>
            <button id="fetchButton" style="padding: 5px 10px; font-size: 14px; cursor: pointer; margin-right: 10px; border: none; border-radius: 4px; background-color: #000000; color: #ffffff; transition: background-color 0.3s, transform 0.2s;">
                    选股
                </button>
    
            <button id="saveQueryButton">保存问句</button>
            <button id="exportButton">导出代码</button>
            
            <div style="width: 100%; margin-top: 10px;">
                <label for="inputValue">请输入选股内容:</label>
                <textarea id="inputValue" placeholder="请输入内容" rows="3"></textarea>
            </div>
        </div>
        <table id="stockTable">
            <thead>
                <tr>
                    <th>序号</th>
                    <th>股票代码</th>
                    <th>股票名称</th>
                    <th>当前价格</th>
                    <th>涨跌幅</th>
                    <th>换手率</th>
                </tr>
            </thead>
            <tbody>
                <!-- 动态数据将插入这里 -->
            </tbody>
        </table>
    </div>
    <script src="wcc.js"></script>
</body>
